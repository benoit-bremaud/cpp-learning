.7274" y2="365.7274"/><polygon fill="#A80036" points="187.75,355.7274,191.75,365.7274,195.75,355.7274,191.75,359.7274" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="191.75" x2="191.75" y1="239.8923" y2="259.8923"/><polygon fill="#A80036" points="187.75,249.8923,191.75,259.8923,195.75,249.8923,191.75,253.8923" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="191.75" x2="191.75" y1="389.7274" y2="409.7274"/><polygon fill="#A80036" points="187.75,399.7274,191.75,409.7274,195.75,399.7274,191.75,403.7274" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="191.75" x2="191.75" y1="446.0715" y2="466.0715"/><polygon fill="#A80036" points="187.75,456.0715,191.75,466.0715,195.75,456.0715,191.75,460.0715" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="191.75" x2="191.75" y1="502.4156" y2="522.4156"/><polygon fill="#A80036" points="187.75,512.4156,191.75,522.4156,195.75,512.4156,191.75,516.4156" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[35c78a429a211c41b7e08479f67fd078]
@startuml
title act — Check an exact measurement target
start
:Establish measurement_target : const int = 3;
:Initialize measurement_count : int;
:Calculate target_matched =\nmeasurement_count == measurement_target;
if (target_matched) then ([true])
  :Write "Target matched" and a newline;
else ([false])
endif
:Write "Check finished" and a newline;
:Return status 0;
stop
@enduml

